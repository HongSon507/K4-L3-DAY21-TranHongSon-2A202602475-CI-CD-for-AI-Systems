name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          GCP_SA_KEY: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Secret STORAGE_CREDENTIALS is empty! Please check GitHub Secrets."
            exit 1
          fi

          python - <<'PYEOF'
          import os, json, sys

          raw = os.environ.get("GCP_SA_KEY", "").strip()
          try:
              data = json.loads(raw)
              print(f"Successfully parsed STORAGE_CREDENTIALS JSON for: {data.get('client_email')}")
          except Exception as e:
              print(f"::error::Failed to parse STORAGE_CREDENTIALS as JSON: {e}")
              print(f"Secret length: {len(raw)} chars. Starts with: {repr(raw[:40])}")
              sys.exit(1)

          # Write to repo root, parent dir, and /tmp
          with open("sa-key.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          with open("../sa-key.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          with open("/tmp/sa-key.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          # Verify GCS access directly
          from google.cloud import storage
          os.environ["GOOGLE_APPLICATION_CREDENTIALS"] = "/tmp/sa-key.json"
          # Normalize bucket name: secret may contain "gs://", trailing "/", path, or whitespace
          raw_bucket = os.environ.get("ARTIFACT_BUCKET", "").strip()
          if raw_bucket.startswith("gs://"):
              raw_bucket = raw_bucket[len("gs://"):]
          bucket_name = raw_bucket.strip("/").split("/")[0].strip() or "income-lab-hongson-510906"
          if not (bucket_name[0].isalnum() and bucket_name[-1].isalnum()):
              print(f"::error::Invalid ARTIFACT_BUCKET after normalization: {bucket_name!r}")
              sys.exit(1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"ARTIFACT_BUCKET_NAME={bucket_name}\n")

          client = storage.Client()
          bucket = client.bucket(bucket_name)
          list(bucket.list_blobs(max_results=1))
          print(f"GCS bucket connection verified: gs://{bucket_name}")
          PYEOF

          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          dvc remote modify --local labstore credentialpath "$(pwd)/sa-key.json"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["ARTIFACT_BUCKET_NAME"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("artifacts/current/model.joblib")
          blob.upload_from_filename("models/model.joblib")
          print(f"Uploaded model to gs://{bucket_name}/artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1_SCORE"])
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: Verify SSH secrets
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret SERVER_SSH_KEY is empty or does not exist! Please check GitHub Settings -> Secrets -> Actions -> Repository Secrets."
            exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::Secret SERVER_HOST is empty!"
            exit 1
          fi
          if [ -z "$USER" ]; then
            echo "::error::Secret SERVER_USER is empty!"
            exit 1
          fi
          echo "SERVER_HOST is set ($HOST)"
          echo "SERVER_USER is set ($USER)"
          echo "SERVER_SSH_KEY length: ${#SSH_KEY} characters"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: |
            ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            # Server tai model tu GCS khi khoi dong -> cho toi da 60s thay vi sleep co dinh
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed after $((i * 2))s."
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after 60s. Service logs:"
            sudo systemctl status income-api --no-pager || true
            sudo journalctl -u income-api -n 50 --no-pager || true
            exit 1

